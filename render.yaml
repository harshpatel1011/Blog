databases:
  - name: blog-db
    plan: free
    databaseName: blog
    user: blog

services:
  - type: web
    name: blog
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn Blog.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: blog-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
